name: WAVE Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration:
    name: Real HTTP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wave_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwave_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: wave_test_password
      DB_NAME: wave_music_mvc
      SESSION_SECRET: integration_test_secret_at_least_32_chars_long_2026
      NODE_ENV: development
      ADMIN_EMAIL: admin.integration@wave.local
      ADMIN_PASSWORD: IntegrationAdmin123!

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Create database schema
        run: mysql -h127.0.0.1 -P3306 -uroot -pwave_test_password < database/schema.sql

      - name: Seed demo data
        run: npm run db:seed

      - name: Create integration Admin
        run: npm run create-admin

      - name: Start WAVE Music server
        run: |
          npm start > server-integration.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "WAVE Music is ready."
              exit 0
            fi
            sleep 1
          done
          cat server-integration.log
          exit 1

      - name: Run 16 real HTTP test cases
        id: integration
        continue-on-error: true
        run: |
          set -o pipefail
          python tests/integration/run_tc_suite.py 2>&1 | tee integration-test.log

      - name: Publish integration summary
        if: always()
        run: |
          {
            echo "## WAVE Music - Real HTTP Integration Test"
            echo ""
            echo "| Nội dung | Kết quả |"
            echo "|---|---|"
            echo "| 16 test case chạy vào http://127.0.0.1:3000 | ${{ steps.integration.outcome }} |"
            echo "| Kết quả TXT | test-results/test_results.txt |"
            echo "| Kết quả JSON | test-results/test_results_summary.json |"
            echo ""
            echo "Các case dùng request HTTP thật, session + CSRF thật và MySQL thật trong môi trường CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-integration-test-results
          path: |
            test-results/test_results.txt
            test-results/test_results_summary.json
            integration-test.log
            server-integration.log
          if-no-files-found: warn

      - name: Commit latest result files to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.integration.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/test_results.txt test-results/test_results_summary.json
          if git diff --cached --quiet; then
            echo "Result files unchanged."
          else
            git commit -m "Update integration test evidence [skip ci]"
            git push
          fi

      - name: Fail workflow when integration tests fail
        if: always()
        run: |
          if [ "${{ steps.integration.outcome }}" != "success" ]; then
            echo "Integration test suite failed."
            exit 1
          fi
          echo "All 16 integration test cases passed."
