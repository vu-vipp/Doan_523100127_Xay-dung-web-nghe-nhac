name: WAVE Music Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and schema checks
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee test-check.log

      - name: Core feature test cases
        id: core
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:core 2>&1 | tee test-core.log

      - name: Regression tests
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:updates 2>&1 | tee test-regression.log

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## WAVE Music - Automated Test Result"
            echo ""
            echo "| Nhóm kiểm thử | Kết quả |"
            echo "|---|---|"
            echo "| Syntax + schema | ${{ steps.syntax.outcome }} |"
            echo "| 10 core test case | ${{ steps.core.outcome }} |"
            echo "| Regression | ${{ steps.regression.outcome }} |"
            echo ""
            echo "Chi tiết xem trong log của từng step hoặc artifact **wave-test-logs**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-test-logs
          path: |
            test-check.log
            test-core.log
            test-regression.log
          if-no-files-found: warn

      - name: Fail workflow when any test failed
        if: always()
        run: |
          if [ "${{ steps.syntax.outcome }}" != "success" ] || \
             [ "${{ steps.core.outcome }}" != "success" ] || \
             [ "${{ steps.regression.outcome }}" != "success" ]; then
            echo "One or more test groups failed."
            exit 1
          fi
          echo "All test groups passed."
